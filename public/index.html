<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0208">
  <title>Tap cards</title>
  <link rel="icon" href="/brand/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/cards.css">
</head>
<body>
  <!-- The home page: anyone who finds the bare address lands here. -->
  <div id="app"><main class="loading"><p>✦ loading ✦</p></main></div>
  <script type="module">
    import { applyLook, filler, loadConfig } from "/js/look.js";
    import { messageScreen } from "/js/ui.js";
    const config = await loadConfig().catch(() => ({}));
    const fill = filler(config);
    document.title = fill("{event} cards");
    await applyLook(config);
    document.getElementById("app").innerHTML = messageScreen(
      config,
      fill,
      fill("{event} tap cards"),
      "got a card? hold it to the top of the back of your phone. setting yours up for the first time? start here:",
      `<a class="msn-button top" style="display:block;text-align:center;text-decoration:none" href="/cards">Set up my card</a>`,
    );
  </script>
</body>
</html>
